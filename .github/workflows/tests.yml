# Runs the lab's automatic tests on every pull request (and on pushes to main).
# The tests use the price files committed in data/csv/ or made-up demo data, and a guard in
# tests/conftest.py makes any test that tries to use the internet fail. So this never downloads prices.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Run the tests
        run: python -m pytest -v
